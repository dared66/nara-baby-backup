name: Offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install optional migration dependencies
        if: matrix.python == '3.14'
        run: python -m pip install -r requirements-migration.txt
      - name: Run offline tests
        run: python -m unittest discover -s tests -v
      - name: Check CLI
        run: python nara_backup.py --help
